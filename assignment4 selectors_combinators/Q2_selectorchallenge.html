<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    <style>
        *{
            font-family: 'Times New Roman', Times, serif;
            margin:0;
            padding: 0;
        }
        .box{
            border: 1px solid#000;
            width:80%;
        }
        ,:firstbox{
            padding: 30px;
            background-color: #e8e0d0;
        }
        .secondbox{
            background: #67a861;
            padding: 30px;
            color:#e8e0d0;

        }
        .thirdbox{
            background: #eee67e;
            padding: 30px;
        }
        .title{
            font-size: 30px;
            margin-bottom: 20px;
            line height:1.4;

        }
        .title span{
            font-weight: bold;
        }
        .small-heading{
            font-size: 12px;
            margin-top:25px;
            margin-bottom:5px;
            letter-spacing: 1px;
        }
        .line{
            border-top: 1px solid #555;
            margin: 10px 0;

        }
        .paragraph{
            font-size:22px;
            margin-top: 15px;
            line-height:1.5;
        }
        .paragraph span{
            font-weight: bold;
        }
        
    </style>
</head>

</body>
</html>
