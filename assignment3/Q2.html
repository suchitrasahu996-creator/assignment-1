<!doctype html>
<html lang="en">

<head>
    <title>Company Launch Invitation</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Arial;
            background: #f8f8f8;
            color: #222;
            padding: 20px;
        }

        .invitation {
            width: 760px;
            max-width: calc(100% - 40px);
            background: white;
            border: 3px solid blue;
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(18, 38, 63, 0.08);
            box-sizing: border-box;
        }

        .logo {
            display: block;
            margin: 0 auto 18px;
            width: 150px;
            height: auto;
            object-fit: contain;
        }

        h2.title {
            font-family: "Times New Roman";
            font-size: 32px;
            text-align: center;
            color: #12345a;
            margin: 6px 0 18px;
            line-height: 1.08;
        }

        .tagline {
            text-align: center;
            margin-bottom: 22px;
            color: #3b4b57;
            font-weight: 500;
        }

        .details {
            background: rgba(30, 115, 190, 0.03);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 18px;
            color: #23343f;
        }

        .details p {
            margin: 6px 0;
        }

        .invitation .center-image {
            display: block;
            margin: 0 auto 22px;
            width: 300px;
            height: auto;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 6px 18px rgba(18, 38, 63, 0.06);
        }

        .btn-join {
            display: inline-block;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #1e73be;
            color: #fff;
            text-decoration: none;
        }

        .btn-join:hover {
            background: #eb4e14;
        }
    </style>
</head>

<body>
    <div>
        <article class="invitation">
            <img class="logo" src="https://ducunl0s4svtl.cloudfront.net/wp-content/uploads/2015/04/logo007.png"
                alt="Company logo">

            <h2 class="title">You're Invited to Our Grand Launch!</h2>
            <div class="tagline">Join us as we unveil the product demos, networking and refreshments.</div>

            <section class="details>
                <h3 style=" margin:0 0 8px; font-size:18px; color:#1e3a4a;">Event Details</h3>
                <p>
                    <strong>Date:</strong> Saturday, 20th December 2025<br>
                    <strong>Time:</strong> 4:00 PM — 7:00 PM<br>
                    <strong>Venue:</strong> The Grand Hall, Sun Auditorium
                </p>
            </section>

            <img class="center-image"
                src="https://th.bing.com/th/id/R.5d9d7a590dbaa3586302172101fc5ed2?rik=zcruUOaQygzU0Q&riu=http%3a%2f%2fimages.assetsdelivery.com%2fcompings_v2%2fmuslumstock%2fmuslumstock1811%2fmuslumstock181107356.jpg&ehk=XPUbowcwreXDf4%2beD4pWfflCsj%2buwR0PQF%2fmDxVgiLY%3d&risl=&pid=ImgRaw&r=0"
                alt="Product preview">

            <div style="display:flex;justify-content:center">
                <button class="btn-join" type="button" aria-label="Join Now">Join Now!</button>
            </div>
        </article>
    </div>
</body>

</html>
